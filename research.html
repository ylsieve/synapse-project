<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Research Hub | Synapse</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom mb-4">
        <div class="container"><a class="navbar-brand fw-bold" href="/">SYNAPSE</a></div>
    </nav>

    <div class="container py-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h2 class="text-center mb-4">Mood & Media Study</h2>
                <p class="text-muted text-center">Contribute anonymous data to our project.</p>
                <hr>
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-bold">How are you feeling right now? (1-10)</label>
                        <input type="range" class="form-range" min="1" max="10" name="mood_score" id="moodRange">
                        <div class="text-center mt-2"><span id="moodVal" class="badge bg-primary">5</span></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Social Media use in the last hour:</label>
                        <select class="form-select" name="usage_time" required>
                            <option value="0">None</option>
                            <option value="15">0-15 mins</option>
                            <option value="45">15-45 mins</option>
                            <option value="60">45+ mins</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Submit Anonymous Data</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Small script to make the slider show the number
        const range = document.getElementById('moodRange');
        const val = document.getElementById('moodVal');
        range.oninput = () => { val.innerText = range.value; };
    </script>
</body>
</html>
